<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Minha To-Do List</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<main class="container">
  <h1>Minha To-Do List</h1>

  <form id="form" autocomplete="off">
    <input id="task" type="text" placeholder="Digite uma tarefa..." />
    <button type="submit" id="addBtn">Adicionar</button>
  </form>

  <div class="toolbar">
    <div class="filters" role="tablist" aria-label="Filtros de tarefas">
      <button type="button" class="filter active" data-filter="all">Todas</button>
      <button type="button" class="filter" data-filter="active">Pendentes</button>
      <button type="button" class="filter" data-filter="done">Concluídas</button>
    </div>

    <div class="meta">
      <span id="counter">0 pendentes</span>
      <button type="button" id="clearDone" class="ghost">Limpar concluídas</button>
    </div>
  </div>

  <ul id="list" aria-label="Lista de tarefas"></ul>

  <p id="empty" class="empty">Nenhuma tarefa ainda. Adicione a primeira 👇</p>
</main>

<script src="script.js"></script>
</body>
</html>
